  <style>
    :root {

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0f14;
      color: #d7e0ea;
      font-family: "Courier New", monospace;
      text-align: center;
      overflow: hidden;
    }

    .wrap {
      width: min(820px, 92vw);
      padding: 40px 24px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 42px;
      letter-spacing: 6px;
      color: #8fd8ff;
      text-shadow: 0 0 8px rgba(143, 216, 255, 0.4);
      animation: glitch 5s infinite;
    }

    .sub {
      margin: 0 auto 24px;
      max-width: 680px;
      color: rgba(215, 224, 234, 0.8);
      font-size: 15px;
      line-height: 1.7;
    }

    .panel {
      display: inline-block;
      padding: 14px 18px;
      border: 1px solid rgba(215,224,234,.15);
      border-radius: 12px;
      background: rgba(255,255,255,.03);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      font-size: 13px;
      letter-spacing: 2px;
      color: #9eb9cc;
    }

    .ghost {
      color: #0b0f14;
      display: inline;
    }

    .tiny {
      margin-top: 18px;
      font-size: 11px;
      color: rgba(215,224,234,.35);
      letter-spacing: 1px;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: rgba(255,255,255,.012);
      animation: flicker 6s infinite;
    }

    @keyframes flicker {
      0% { opacity: 0.02; }
      50% { opacity: 0.05; }
      100% { opacity: 0.02; }
    }

    @keyframes glitch {
      0%, 96%, 100% { transform: translate(0,0); }
      97% { transform: translate(-1px, 1px); }
      98% { transform: translate(1px, -1px); }
      99% { transform: translate(-1px, 0); }
    }
  </style>
</head>
