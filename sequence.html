<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sequence Node</title>

  <style>
    :root {
      --bg: #020402;
      --bg-top: #010201;
      --panel: #071107;
      --panel-2: #0a170a;
      --border: #173417;
      --border-soft: rgba(167, 255, 77, 0.22);
      --text: #9cff9c;
      --text-dim: #5cab5c;
      --text-bright: #e5ffe5;
      --accent: #a7ff4d;
      --shadow: rgba(80, 255, 80, 0.08);
      --shadow-strong: rgba(80, 255, 80, 0.14);
      --radius: 0px;
      --space-1: 10px;
      --space-2: 14px;
      --space-3: 18px;
      --space-4: 22px;
      --space-5: 26px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(0, 255, 120, 0.05), transparent 35%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 100%);
      color: var(--text);
      font-family: "Courier New", Courier, monospace;
    }

    body {
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }

    .scanlines::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.02) 0px,
        rgba(255, 255, 255, 0.02) 1px,
        transparent 2px,
        transparent 4px
      );
      opacity: 0.18;
      mix-blend-mode: screen;
      z-index: 999;
    }

    .shell {
      max-width: 1100px;
      margin: 0 auto;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(5, 15, 5, 0.95), rgba(3, 8, 3, 0.96));
      box-shadow:
        0 0 0 1px rgba(60, 255, 60, 0.05) inset,
        0 0 30px var(--shadow);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #0d180d, #091009);
      font-size: 13px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(167, 255, 77, 0.7);
      display: inline-block;
      margin-right: 8px;
    }

    .content {
      padding: var(--space-5) var(--space-4);
      display: grid;
      gap: var(--space-4);
    }

    h1 {
      margin: 0;
      font-size: 40px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(156, 255, 156, 0.18);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .terminal-panel, .clue-panel {
      border: 1px solid var(--border);
      padding: 18px;
    }

    .cipher-block {
      white-space: pre-wrap;
      line-height: 1.9;
      font-size: 18px;
    }

    .clue-video iframe {
      width: 100%;
      aspect-ratio: 16/9;
      border: none;
    }

    .clue-text {
      text-align: center;
      font-size: 20px;
      margin-top: 10px;
    }

.audio-panel {
  margin: 18px var(--space-4) 14px; 
  padding: 16px 18px;

  border: 2px solid #00ff88;
  background: linear-gradient(
    180deg,
    rgba(10, 25, 10, 0.92),
    rgba(5, 12, 5, 0.96)
  );

  box-shadow:
    inset 0 0 18px rgba(0, 255, 100, 0.08),
    0 0 10px rgba(0, 255, 100, 0.18);

  position: relative;

  animation: audioContainerPulse 2.4s infinite ease-in-out;
}

    @keyframes audioContainerPulse {
      0% {
        box-shadow: 0 0 6px rgba(0, 255, 100, 0.15);
        border-color: #00cc66;
      }
      50% {
        box-shadow: 0 0 18px rgba(0, 255, 100, 0.6);
        border-color: #00ff88;
        transform: scale(1.01);
      }
      100% {
        box-shadow: 0 0 6px rgba(0, 255, 100, 0.15);
        border-color: #00cc66;
      }
    }

    .audio-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .audio-button {
      background: transparent;
      color: var(--text-bright);
      border: 1px solid rgba(167,255,77,0.45);
      padding: 12px 16px;
      cursor: pointer;
      animation: audioPulse 2.8s infinite ease-in-out;
    }

    @keyframes audioPulse {
      50% {
        box-shadow: 0 0 12px rgba(167,255,77,0.4);
      }
    }

    /* flicker text */
    .flicker {
      font-size: 12px;
      opacity: 0.8;
      margin-bottom: 8px;
      animation: flickerAnim 3s infinite;
    }

    @keyframes flickerAnim {
      0%,100% { opacity: 0.8; }
      50% { opacity: 0.4; }
    }

  </style>
</head>

<body class="scanlines">

  <div class="shell">

    <div class="topbar">
      <div><span class="status-dot"></span>Sequence Node Active</div>
      <div>Obsidian Control Gateway</div>
    </div>

    <main class="content">

      <h1>Sequence Fragment</h1>

      <section class="main-grid">

        <div class="terminal-panel">
          <div class="cipher-block">
ALL PARTS PRESENT

YOU’VE ALREADY FOUND THEM

NOW PUT THEM IN THE RIGHT ORDER
          </div>
        </div>

        <div class="clue-panel">
          <div class="clue-video">
            <iframe src="https://www.youtube.com/embed/-KRtN6-DgrY"></iframe>
          </div>
          <div class="clue-text">BINGO! The sequence has been delivered.</div>
        </div>

      </section>

    </main>

    <!-- 🔥 UPDATED AUDIO SECTION -->
    <section class="audio-panel">
      <div class="flicker">…signal detected…</div>

      <div class="audio-row">
        <div>Of course, you'll need this too...</div>

        <button id="playAudioBtn" class="audio-button">
          Initialize Sequence Audio
        </button>
      </div>

      <audio id="player">
        <source src="media/whatsnext.mp3" type="audio/mpeg" />
      </audio>
    </section>

  </div>

  <script>
    const audio = document.getElementById("player");
    document.getElementById("playAudioBtn").onclick = () => {
      audio.currentTime = 0;
      audio.play();
    };
  </script>

</body>
</html>
