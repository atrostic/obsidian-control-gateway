<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Initialize</title>
  <style>
    body {
      margin: 0;
      background: #0b0f14;
      color: #d7e0ea;
      font-family: Arial, sans-serif;
    }
    #overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #0b0f14;
      cursor: pointer;
      text-align: center;
    }
  </style>
</head>
<body>

<div id="overlay">
  <div>
    <h1>CLICK TO INITIALIZE</h1>
    <p>Audio channel locked pending user interaction.</p>
  </div>
</div>

<audio id="player">
  <source src="media/whatsnext.mp3" type="audio/mpeg">
</audio>

<script>
  const overlay = document.getElementById("overlay");
  const audio = document.getElementById("player");

  overlay.addEventListener("click", async () => {
    try {
      await audio.play();
      overlay.style.display = "none";
    } catch (err) {
      console.log("Playback failed:", err);
    }
  });
</script>

</body>
</html>
