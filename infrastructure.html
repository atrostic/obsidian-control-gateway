<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Infrastructure Node</title>

  <style>
    :root {
      --bg: #020402;
      --border: #173417;
      --text: #9cff9c;
      --text-dim: #5cab5c;
      --text-bright: #e5ffe5;
      --accent: #a7ff4d;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Courier New", monospace;
    }

    body {
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* CRT scanlines across whole page */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.02) 0px,
        rgba(255,255,255,0.02) 1px,
        transparent 2px,
        transparent 4px
      );
      pointer-events: none;
      z-index: 2;
    }

    .shell {
      max-width: 1000px;
      margin: auto;
      border: 1px solid var(--border);
      background: linear-gradient(#071107, #020402);
      box-shadow: 0 0 24px rgba(0,255,120,0.05);
      position: relative;
      z-index: 1;
    }

    .topbar {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      text-transform: uppercase;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
    }

    .content {
      padding: 24px;
      display: grid;
      gap: 24px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      color: var(--text-bright);
      text-transform: uppercase;
    }

    .panel {
      border: 1px solid var(--border);
      padding: 18px;
      background: linear-gradient(#0a160a, #040904);
      box-shadow: inset 0 0 10px rgba(0,255,100,0.03);
    }

    .panel-title {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* IMAGE + GLITCH */

    .image-box {
      border: 1px solid var(--border);
      background: black;
      overflow: hidden;
      position: relative;
    }

    .image-box img {
      width: 100%;
      display: block;
      filter: contrast(1.05) saturate(0.9);
      animation: imageGlitch 7s infinite;
    }

    /* subtle movement glitch */
    @keyframes imageGlitch {
      0%, 96%, 100% {
        transform: translate(0,0);
      }
      97% {
        transform: translate(2px, -1px);
      }
      98% {
        transform: translate(-2px, 1px);
      }
      99% {
        transform: translate(1px, 0);
      }
    }

    /* scanline overlay */
    .glitch-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,255,120,0.03) 0px,
        rgba(0,255,120,0.03) 1px,
        transparent 2px,
        transparent 4px
      );
      opacity: 0.4;
      animation: scanFlicker 5s infinite;
    }

    @keyframes scanFlicker {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.55; }
    }

    /* occasional signal break */
    .image-box::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,255,120,0.08);
      mix-blend-mode: screen;
      pointer-events: none;
      animation: signalBreak 9s infinite;
    }

    @keyframes signalBreak {
      0%, 98%, 100% { opacity: 0; }
      99% {
        opacity: 1;
        transform: translate(3px, -2px) skewX(3deg);
      }
    }

    .clue {
      text-align: center;
      font-size: 20px;
      letter-spacing: 0.06em;
      color: var(--text-bright);
      margin-top: 14px;
    }

    /* INPUTS */

    .entry-panel {
      display: grid;
      gap: 14px;
    }

    .entry-row {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 14px;
      align-items: center;
    }

    .entry-label {
      color: var(--text-dim);
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    .entry-input {
      width: 100%;
      background: #020402;
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 12px 14px;
      font-family: "Courier New", monospace;
      font-size: 18px;
      text-transform: uppercase;
    }

    .entry-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(167,255,77,0.15);
    }

    button {
      background: #081208;
      color: var(--text-bright);
      border: 1px solid var(--border);
      padding: 12px 18px;
      font-family: "Courier New", monospace;
      text-transform: uppercase;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .status {
      font-size: 14px;
      color: var(--text-dim);
    }

    .status.error { color: #ff8c8c; }
    .status.success { color: var(--accent); }

    @media (max-width: 800px) {
      .entry-row {
        grid-template-columns: 1fr;
      }
    }

  </style>
</head>

<body>

<div class="shell">

  <div class="topbar">
    <div>Infrastructure Node</div>
    <div>Obsidian Control Gateway</div>
  </div>

  <div class="content">

    <div class="panel">
      <h1>Visual Reference</h1>

      <div class="image-box">
        <img src="images/tiki.png" alt="Tiki statues">
        <div class="glitch-overlay"></div>
      </div>

      <div class="clue">
        Seek and you shall find.
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Verification</div>

      <div class="entry-panel">

        <div class="entry-row">
          <label class="entry-label">Image One</label>
          <input class="entry-input" id="clue1" placeholder="Enter first image">
        </div>

        <div class="entry-row">
          <label class="entry-label">Image Two</label>
          <input class="entry-input" id="clue2" placeholder="Enter second image">
        </div>

        <button id="verifyBtn">Verify</button>

        <div id="status" class="status"></div>

      </div>
    </div>

  </div>
</div>

<script>
  const ANSWER_ONE = "king";
  const ANSWER_TWO = "duck";

  const clue1 = document.getElementById("clue1");
  const clue2 = document.getElementById("clue2");
  const statusEl = document.getElementById("status");

  function normalize(v) {
    return v.trim().toLowerCase().replace(/[^a-z0-9]/g, "");
  }

  document.getElementById("verifyBtn").onclick = () => {
    const a = normalize(clue1.value);
    const b = normalize(clue2.value);

    if (!a || !b) {
      statusEl.textContent = "Both entries required.";
      statusEl.className = "status error";
      return;
    }

    if (a === ANSWER_ONE && b === ANSWER_TWO) {
      statusEl.textContent = "Accepted.";
      statusEl.className = "status success";
      setTimeout(() => window.location.href = "kingduck.html", 1500);
    } else {
      statusEl.textContent = "Incorrect.";
      statusEl.className = "status error";
    }
  };
</script>

</body>
</html>
