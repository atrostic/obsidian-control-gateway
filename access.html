<script>
/* ADD THESE FUNCTIONS */

function shuffleArray(array) {
  const copy = array.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = secureRandomInt(i + 1);
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function randomLetter() {
  return alphabet[secureRandomInt(alphabet.length)];
}

function animateCipherLockIn(finalText) {
  const length = finalText.length;
  const current = Array.from({ length }, randomLetter);
  const unlocked = new Set(Array.from({ length }, (_, i) => i));
  const order = shuffleArray([...unlocked]);

  output.classList.remove('stable', 'flicker');
  output.style.letterSpacing = '0.28em';

  let interval = setInterval(() => {
    unlocked.forEach(i => current[i] = randomLetter());
    output.textContent = current.join('');
  }, 45);

  function lockNext(i) {
    if (i >= order.length) {
      clearInterval(interval);
      output.textContent = finalText;
      output.classList.add('stable', 'flicker');
      output.style.letterSpacing = '';
      setTimeout(() => output.classList.remove('flicker'), 340);
      return;
    }

    const idx = order[i];
    unlocked.delete(idx);
    current[idx] = finalText[idx];
    output.textContent = current.join('');

    setTimeout(() => lockNext(i + 1), 120 + secureRandomInt(160));
  }

  setTimeout(() => lockNext(0), 220);
}
