<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Location Node</title>

  <style>
    :root {
      --bg: #020402;
      --bg-top: #010201;
      --panel: #071107;
      --border: #173417;
      --text: #9cff9c;
      --text-dim: #5cab5c;
      --text-bright: #e5ffe5;
      --accent: #a7ff4d;
      --shadow: rgba(80,255,80,0.08);
      --space-2: 14px;
      --space-3: 18px;
      --space-4: 22px;
      --space-5: 26px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(0,255,120,0.05), transparent 35%),
        linear-gradient(180deg, var(--bg-top), var(--bg));
      color: var(--text);
      font-family: "Courier New", monospace;
    }

    .scanlines::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.02) 0px,
        rgba(255,255,255,0.02) 1px,
        transparent 2px,
        transparent 4px
      );
      opacity: 0.18;
      z-index: 999;
    }

    .shell {
      max-width: 1180px;
      margin: auto;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(5,15,5,0.95), rgba(3,8,3,0.96));
      box-shadow:
        0 0 0 1px rgba(60,255,60,0.05) inset,
        0 0 30px var(--shadow);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #0d180d, #091009);
      color: var(--text-dim);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(167,255,77,0.7);
      display: inline-block;
      margin-right: 8px;
    }

    .content {
      padding: var(--space-5) var(--space-4) 28px;
      display: grid;
      gap: var(--space-4);
    }

    .header-block,
    .panel {
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(10,23,10,0.9), rgba(5,10,5,0.95));
      padding: var(--space-3);
      box-shadow: inset 0 0 10px rgba(0,255,100,0.03);
    }

    .bootline {
      color: var(--text-dim);
      font-size: 13px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 44px);
      color: var(--text-bright);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .location-text {
      white-space: pre-line;
      font-size: 20px;
      line-height: 1.8;
      color: var(--text-bright);
      text-align: center;
    }

    .image-panel {
      border: 1px solid var(--border);
      padding: 10px;
      background: #000;
      text-align: center;
    }

    .image-panel img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: auto;
    }
  </style>
</head>

<body class="scanlines">
  <div class="shell">

    <div class="topbar">
      <div><span class="status-dot"></span>Location Node Active</div>
      <div>Obsidian Control Gateway</div>
    </div>

    <main class="content">

      <section class="header-block">
        <div class="bootline">Obsidian Systems / Location Resolution</div>
        <h1>Location Fragment</h1>
      </section>

      <section class="panel">
        <div class="location-text">
THE SYSTEM DOES NOT HIDE EVERYTHING

SOME SIGNALS ARE LEFT
IN THE OPEN

THE ANSWER HAS BEEN
HANGING IN FRONT OF YOU
          
PLACED WITH INTENT

BY A TRUSTED HAND

YOU’VE ALREADY PASSED IT TODAY
        </div>
      </section>

      <!-- KEEP YOUR EXISTING IMAGE PATH EXACTLY -->
      <section class="image-panel">
        <img src="images/your-existing-image.jpg" alt="Location clue image">
      </section>

    </main>
  </div>
</body>
</html>
