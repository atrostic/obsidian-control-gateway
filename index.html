<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Keep Looking</title>

<style>
body {
    background-color: #0b0f14;
    color: #9fd4ff;
    font-family: "Courier New", monospace;
    text-align: center;
    margin-top: 60px;
}

/* Subtle screen flicker */
body::after {
    content: "";
    pointer-events: none;
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.01);
    animation: flicker 6s infinite;
}

@keyframes flicker {
    0% { opacity: .02; }
    50% { opacity: .04; }
    100% { opacity: .02; }
}

img {
    max-width: 75%;
    height: auto;
    border-radius: 6px;
    box-shadow: 0 0 25px rgba(0,0,0,0.7);
}

/* Terminal style headline */
h1 {
    margin-top: 30px;
    font-size: 34px;
    letter-spacing: 4px;
    color: #7fdfff;
    text-shadow: 0 0 6px rgba(127,223,255,0.6);
    animation: glitch 4s infinite;
}

/* Very subtle glitch */
@keyframes glitch {
    0% { transform: translate(0); }
    96% { transform: translate(0); }
    97% { transform: translate(-1px, 1px); }
    98% { transform: translate(1px, -1px); }
    99% { transform: translate(-1px, 0); }
    100% { transform: translate(0); }
}

.status {
    margin-top: 15px;
    font-size: 14px;
    color: #6fa5c8;
    letter-spacing: 2px;
}
</style>

</head>

<body>

<!-- Seriously, there isn't anything here.  Keep looking! -->

<img src="images/keeplooking.jpg" alt="Keep Looking">

<h1>KEEP LOOKING</h1>

<div class="status">
VECTOR TRACE ACTIVE
</div>

</body>
</html>
